services:
  app:
    image: node:22-bookworm
    working_dir: /workspace
    ports:
      - "8080:8080"
    volumes:
      - .:/workspace
      - local_node_modules:/workspace/node_modules
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      sh -lc '
        npm ci &&
        set -a &&
        . ./.env.local &&
        set +a &&
        VITE_SUPABASE_URL="$(printf "%s" "$VITE_SUPABASE_URL" | sed "s#://127.0.0.1#://host.docker.internal#; s#://localhost#://host.docker.internal#")" &&
        export VITE_SUPABASE_URL &&
        npm run dev -- --host 0.0.0.0 --port 8080
      '

  minio:
    image: minio/minio:RELEASE.2024-07-04T14-25-45Z
    container_name: therapy-flow-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: devminio
      MINIO_ROOT_PASSWORD: devminio123
    command: server /data --console-address ":9001"
    volumes:
      - ./minio-data:/data

volumes:
  local_node_modules:
