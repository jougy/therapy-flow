name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Workers
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Pulumi ESC via OIDC
        uses: pulumi/auth-actions@v1
        with:
          organization: joao-tdoval-gmail-com-org
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:joao-tdoval-gmail-com

      - name: Setup Pulumi ESC CLI
        uses: pulumi/setup-pulumi@v2

      - name: Pull Production Secrets from Pulumi ESC
        shell: bash
        run: |
          pulumi env open joao-tdoval-gmail-com-org/plurihealth/pluri-prod --format dotenv > /tmp/prod.env
          node -e '
            const fs = require("fs");
            const envContent = fs.readFileSync("/tmp/prod.env", "utf8");
            for (const line of envContent.split("\n")) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith("#")) continue;
              const eqIdx = trimmed.indexOf("=");
              if (eqIdx === -1) continue;
              const key = trimmed.slice(0, eqIdx).trim();
              let val = trimmed.slice(eqIdx + 1).trim();
              if ((val.startsWith("\"") && val.endsWith("\"")) || (val.startsWith("\x27") && val.endsWith("\x27"))) {
                val = val.slice(1, -1);
              }
              fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${val}\n`);
            }
          '
          rm -f /tmp/prod.env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (for Smoke Test)
        run: npx playwright install --with-deps chromium

      - name: Run Pre-Deploy Quality Gate & Smoke Test
        run: bash scripts/dev/pre-deploy-guard.sh

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
