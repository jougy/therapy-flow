name: Deploy Frontend

on:
  push:
    branches:
      - main
    paths-ignore:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy to Cloudflare Workers
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Pulumi ESC via OIDC
        uses: pulumi/auth-actions@v1
        with:
          organization: joao-tdoval-gmail-com-org
          requested-token-type: urn:pulumi:token-type:access_token:organization

      - name: Setup Pulumi ESC CLI
        uses: pulumi/setup-pulumi@v2

      - name: Pull Production Secrets from Pulumi ESC
        run: |
          pulumi env open joao-tdoval-gmail-com-org/plurihealth/pluri-prod --format dotenv > /tmp/prod.env
          cat /tmp/prod.env >> "$GITHUB_ENV"
          rm -f /tmp/prod.env

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (for Smoke Test)
        run: npx playwright install --with-deps chromium

      - name: Run Pre-Deploy Quality Gate & Smoke Test
        run: bash scripts/dev/pre-deploy-guard.sh

      - name: Deploy to Cloudflare Workers
        run: npx wrangler deploy
