name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers (for Smoke Test)
        run: npx playwright install --with-deps chromium

      - name: Run Full Pre-Merge Quality Gate & Smoke Test
        run: bash scripts/dev/pre-deploy-guard.sh
        env:
          VITE_SUPABASE_PROJECT_ID: local
          VITE_SUPABASE_PUBLISHABLE_KEY: ci-anon-key
          VITE_SUPABASE_URL: https://example.supabase.co
