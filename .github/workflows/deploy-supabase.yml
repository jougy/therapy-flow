name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Pulumi ESC via OIDC
        uses: pulumi/auth-actions@v1
        with:
          organization: joao-tdoval-gmail-com-org
          requested-token-type: urn:pulumi:token-type:personal

      - name: Setup Pulumi ESC CLI
        uses: pulumi/setup-pulumi@v2

      - name: Pull Production Secrets from Pulumi ESC
        run: |
          pulumi env open joao-tdoval-gmail-com-org/plurihealth/pluri-prod --format dotenv > /tmp/prod.env
          cat /tmp/prod.env >> "$GITHUB_ENV"
          rm -f /tmp/prod.env

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Resolve project ref from Supabase config
        run: |
          PROJECT_ID=$(sed -n 's/^project_id = "\(.*\)"$/\1/p' supabase/config.toml)
          if [ -z "$PROJECT_ID" ]; then
            echo "Could not resolve Supabase project_id from supabase/config.toml" >&2
            exit 1
          fi
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Validate environment secrets
        shell: bash
        run: |
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::A secret SUPABASE_DB_PASSWORD está vazia ou não disponível neste run."
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::A secret SUPABASE_ACCESS_TOKEN está vazia ou não disponível neste run."
            exit 1
          fi
          echo "Secrets SUPABASE_DB_PASSWORD e SUPABASE_ACCESS_TOKEN presentes."

      - name: Push migrations to production
        shell: bash
        run: |
          ENCODED_PASSWORD=$(node -e "console.log(encodeURIComponent(process.env.SUPABASE_DB_PASSWORD))")
          DB_URL="postgresql://postgres.${PROJECT_ID}:${ENCODED_PASSWORD}@aws-1-sa-east-1.pooler.supabase.com:5432/postgres"
          supabase db push --include-all --db-url "$DB_URL"

      - name: Deploy Edge Functions
        shell: bash
        run: |
          supabase functions deploy --project-ref "$PROJECT_ID" --use-api
