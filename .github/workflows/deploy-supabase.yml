name: Deploy Supabase

on:
  push:
    branches:
      - main
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

jobs:
  push-migrations:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Pulumi ESC via OIDC
        uses: pulumi/auth-actions@v1
        with:
          organization: joao-tdoval-gmail-com-org
          requested-token-type: urn:pulumi:token-type:access_token:personal
          scope: user:joao-tdoval-gmail-com

      - name: Setup Pulumi ESC CLI
        uses: pulumi/setup-pulumi@v2

      - name: Pull Production Secrets from Pulumi ESC
        shell: bash
        run: |
          pulumi env open joao-tdoval-gmail-com-org/plurihealth/pluri-prod --format dotenv > /tmp/prod.env
          node -e '
            const fs = require("fs");
            const envContent = fs.readFileSync("/tmp/prod.env", "utf8");
            for (const line of envContent.split("\n")) {
              const trimmed = line.trim();
              if (!trimmed || trimmed.startsWith("#")) continue;
              const eqIdx = trimmed.indexOf("=");
              if (eqIdx === -1) continue;
              const key = trimmed.slice(0, eqIdx).trim();
              let val = trimmed.slice(eqIdx + 1).trim();
              if ((val.startsWith("\"") && val.endsWith("\"")) || (val.startsWith("\x27") && val.endsWith("\x27"))) {
                val = val.slice(1, -1);
              }
              fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${val}\n`);
            }
          '
          rm -f /tmp/prod.env

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.75.0

      - name: Resolve project ref from Supabase config
        run: |
          PROJECT_ID=$(sed -n 's/^project_id = "\(.*\)"$/\1/p' supabase/config.toml)
          if [ -z "$PROJECT_ID" ]; then
            echo "Could not resolve Supabase project_id from supabase/config.toml" >&2
            exit 1
          fi
          echo "PROJECT_ID=$PROJECT_ID" >> "$GITHUB_ENV"

      - name: Validate environment secrets
        shell: bash
        run: |
          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::A secret SUPABASE_DB_PASSWORD está vazia ou não disponível neste run."
            exit 1
          fi
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::A secret SUPABASE_ACCESS_TOKEN está vazia ou não disponível neste run."
            exit 1
          fi
          echo "Secrets SUPABASE_DB_PASSWORD e SUPABASE_ACCESS_TOKEN presentes."

      - name: Link to Supabase project
        shell: bash
        run: |
          supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Push migrations to production
        shell: bash
        run: |
          supabase db push --include-all --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        shell: bash
        run: |
          supabase functions deploy --project-ref "$PROJECT_ID" --use-api
