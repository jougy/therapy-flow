<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google" content="notranslate" />
    <title>Pluri Health — Sistema de Gestão para Clínicas e Equipes de Saúde</title>
    <meta name="description" content="Pluri Health: plataforma brasileira de prontuário eletrônico, governança clínica, agendamento por salas e faturamento para clínicas e profissionais de saúde.">
    <meta name="author" content="Pluri Health" />

    <!-- Webmaster Verification Tags (Google Search Console & Bing Webmaster Tools) -->
    <meta name="google-site-verification" content="google-site-verification-token" />
    <meta name="msvalidate.01" content="msvalidate-token" />

    <!-- Preconnect para Origens Críticas (Fontes) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- Otimização Crítica LCP (Descoberta Imediata da Logo no Documento Inicial) -->
    <link rel="preload" as="image" href="/branding/logo/pluri_health_icon_gradient.svg" type="image/svg+xml" fetchpriority="high">

    <!-- Descoberta de Agentes Autônomos (ARD 1.0 / WebMCP) -->
    <link rel="ard" href="/.well-known/ard.json" type="application/json">
    <link rel="ai-catalog" href="/.well-known/ai-catalog.json" type="application/json">

    <!-- Carregamento Assíncrono Não-Bloqueante de Fontes (CSP-safe: sem inline onload, ativado via main.tsx) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    <link id="google-fonts-inter" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" media="print">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
    </noscript>

    <!-- Critical CSS Inline para Pintura Imediata do App Shell e LCP antes do Bundle JS -->
    <style>
      :root {
        --bg-shell: #f8fafc;
        --fg-shell: #1e293b;
        --muted-shell: #475569;
      }
      html.dark {
        --bg-shell: #151923;
        --fg-shell: #f1f5f9;
        --muted-shell: #94a3b8;
      }
      body {
        margin: 0;
        background-color: var(--bg-shell);
        color: var(--fg-shell);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .pluri-initial-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        box-sizing: border-box;
      }
      .pluri-initial-brand {
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .pluri-initial-logo {
        width: 64px;
        height: 64px;
        margin-bottom: 0.75rem;
        filter: drop-shadow(0 4px 3px rgb(0 0 0 / 0.07)) drop-shadow(0 2px 2px rgb(0 0 0 / 0.06));
      }
      .pluri-initial-title {
        margin: 0;
        font-size: 1.5rem;
        line-height: 2rem;
        font-weight: 700;
        letter-spacing: -0.025em;
        color: var(--fg-shell);
      }
      .pluri-initial-subtitle {
        margin: 0.125rem 0 0;
        font-size: 0.875rem;
        line-height: 1.25rem;
        color: var(--muted-shell);
      }
    </style>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pluri Health" />
    <meta property="og:image" content="/brand/plurihealth.png">
    <meta property="og:title" content="Pluri Health — Sistema de Gestão para Clínicas e Equipes de Saúde">
    <meta property="og:description" content="Plataforma completa de prontuário eletrônico, governança clínica, agendas por salas e faturamento para clínicas de saúde.">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@plurihealth" />
    <meta name="twitter:title" content="Pluri Health — Sistema de Gestão para Clínicas e Equipes de Saúde">
    <meta name="twitter:description" content="Plataforma completa de prontuário eletrônico, governança clínica, agendas por salas e faturamento para clínicas de saúde.">
    <meta name="twitter:image" content="/brand/plurihealth.png">

    <!-- Favicons Oficiais Pluri Health (Compatibilidade Total com Google Search, PWA e Browsers) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.webmanifest">
    <meta name="theme-color" content="#0284c7" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Pluri Health" />
    <meta name="mobile-web-app-capable" content="yes" />

  </head>

  <body translate="no" class="notranslate">
    <div id="root" translate="no" class="notranslate">
      <div class="pluri-initial-shell" aria-busy="true">
        <div class="pluri-initial-brand">
          <img
            src="/branding/logo/pluri_health_icon_gradient.svg"
            alt="Pluri-Health"
            width="64"
            height="64"
            fetchpriority="high"
            decoding="sync"
            class="pluri-initial-logo"
          />
          <h1 class="pluri-initial-title">Pluri-Health</h1>
          <p class="pluri-initial-subtitle">Gestão clínica simplificada</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
